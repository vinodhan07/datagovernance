services:

  # ── Application databases ──────────────────────────────────────────────────

  postgres:
    image: postgres:16
    container_name: my-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: dataguard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d dataguard"]
      interval: 5s
      timeout: 5s
      retries: 10

  mariadb:
    image: mariadb:latest
    container_name: mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root123
      MARIADB_DATABASE: governance_db
    ports:
      - "3307:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Spline lineage stack ───────────────────────────────────────────────────

  arangodb:
    image: arangodb:3.11.3
    container_name: spline-arangodb
    restart: unless-stopped
    environment:
      ARANGO_NO_AUTH: "1"
    ports:
      - "8529:8529"
    volumes:
      - arangodb_data:/var/lib/arangodb3

  spline-db-init:
    image: absaoss/spline-admin:latest
    container_name: spline-db-init
    command: db-init arangodb://arangodb:8529/spline
    depends_on:
      arangodb:
        condition: service_started
    restart: "no"

  spline-rest-server:
    image: absaoss/spline-rest-server:latest
    container_name: spline-rest-server
    restart: unless-stopped
    environment:
      spline.database.connectionUrl: arangodb://arangodb:8529/spline
      spline.database.auto-init: "false"
      SPLINE_CORS_ALLOWEDORIGINS: "*"
      SPLINE_REST_CORS_ALLOWEDORIGINS: "*"
      JAVA_OPTS: "-Dspline.cors.allowedOrigins=* -Dspline.rest.cors.allowedOrigins=*"
    ports:
      - "8080:8080"
    depends_on:
      - spline-db-init

  spline-web-ui:
    image: absaoss/spline-web-ui:latest
    container_name: spline-web-ui
    restart: unless-stopped
    environment:
      SPLINE_CONSUMER_URL: /consumer
    depends_on:
      - spline-rest-server

  spline-proxy:
    image: nginx:alpine
    container_name: spline-proxy
    restart: unless-stopped
    ports:
      - "9090:80"
    volumes:
      - ./nginx-spline.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - spline-web-ui
      - spline-rest-server

  # ── OpenMetadata catalog stack ─────────────────────────────────────────────

  openmetadata-db:
    image: mysql:8.0
    container_name: openmetadata-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: openmetadata_password
      MYSQL_DATABASE: openmetadata_db
    volumes:
      - openmetadata_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-popenmetadata_password"]
      interval: 10s
      timeout: 5s
      retries: 10

  openmetadata-server:
    image: openmetadata/server:1.3.1
    container_name: openmetadata-server
    restart: unless-stopped
    depends_on:
      openmetadata-db:
        condition: service_healthy
    ports:
      - "8585:8585"
    environment:
      DB_DRIVER_CLASS: com.mysql.cj.jdbc.Driver
      DB_SCHEME: mysql
      DB_USE_SSL: "false"
      DB_USER: root
      DB_USER_PASSWORD: openmetadata_password
      DB_HOST: openmetadata-db
      DB_PORT: 3306
      OM_DATABASE: openmetadata_db
      AUTHENTICATION_PROVIDER: basic
      AIRFLOW_HOST: http://localhost:8080
      SERVER_HOST_API_URL: http://localhost:8585/api

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.13.0
    container_name: mlflow-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - /home/vinodhan/Desktop/Project/DATA GOVERENCE:/home/vinodhan/Desktop/Project/DATA GOVERENCE
    working_dir: /home/vinodhan/Desktop/Project/DATA GOVERENCE
    command: ["mlflow", "server", "--backend-store-uri", "sqlite:////home/vinodhan/Desktop/Project/DATA GOVERENCE/backend/ml_governance/mlflow.db", "--default-artifact-root", "/home/vinodhan/Desktop/Project/DATA GOVERENCE/backend/ml_governance/mlartifacts", "--host", "0.0.0.0", "--port", "5000"]

volumes:
  postgres_data:
  mariadb_data:
  arangodb_data:
  openmetadata_mysql_data:
