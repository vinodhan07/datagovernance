[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.13.1",
    "bcrypt>=4.0.0",
    "cryptography==42.0.7",
    "deepeval>=1.4.0",
    "dotenv>=0.9.9",
    "fastapi==0.111.0",
    "groq>=0.11.0",
    "httpx>=0.27.0",
    "openpyxl>=3.1.0",
    "pandas>=2.0.0",
    "psycopg2-binary==2.9.9",
    "pydantic>=2.10.0",
    "pydantic-settings==2.2.1",
    "pymysql==1.1.0",
    "pyspark>=3.5.0,<4.0.0",
    "python-dotenv==1.0.1",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart==0.0.9",
    "requests==2.31.0",
    "setuptools>=65.0.0",
    "soda-core>=3.3.0",
    "soda-core-mysql>=3.3.0",
    "soda-core-postgres>=3.3.0",
    "sqlalchemy==2.0.36",
    "sse-starlette==1.8.2",
    "types-pymysql>=1.1.0.20260408",
    "types-requests>=2.33.0.20260408",
    "uvicorn[standard]==0.29.0",
    "llm-guard>=0.4.0",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = [".venv/lib/python3.12/site-packages", "."]
exclude = [".venv"]

[tool.pyrefly]
search-path = [".venv/lib/python3.12/site-packages", "."]
python-interpreter-path = ".venv/bin/python"
